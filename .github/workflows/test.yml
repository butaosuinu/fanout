name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # The dashboard web bundle is not committed; build it so the embedded
      # asset smoke tests run instead of skipping.
      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Run Go unit tests
        run: make build-web go-test

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Type check + tests
        run: make lint-web test-web

  tier1:
    name: Tier 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # make test-tier1 builds fanout-go, which embeds the web bundle.
      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install bats / jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run Tier 1 tests
        run: make test-tier1

  tier2:
    name: Tier 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # make test-tier2 builds fanout-go, which embeds the web bundle.
      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install bats / jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run Tier 2 tests
        run: make test-tier2

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # No Node here on purpose: the package compiles without the web bundle
      # (static/.gitkeep + go:embed all:), so linting stays Node-free.
      - name: golangci-lint
        # version-file needs golangci-lint-action >= v9.2.0
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell lint
        run: make lint-shell
