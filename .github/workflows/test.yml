name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go unit tests
        run: make go-test

  tier1:
    name: Tier 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install bats / jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run Tier 1 tests
        run: make test-tier1

  tier2:
    name: Tier 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install bats / jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run Tier 2 tests
        run: make test-tier2

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run lint
        run: make lint
