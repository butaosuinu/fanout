name: Issue 866 isolated Linux capture
on:
  push:
    branches: [fanout/epic-865-866-isolated-spike]
    paths: [.github/workflows/issue-866-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Capture only an owned harmless process
        shell: python
        run: |
          import json, os, pathlib, platform, subprocess, tempfile
          root = pathlib.Path(tempfile.mkdtemp(prefix="fanout-866-"))
          work = root / "work with spaces"
          work.mkdir()
          env = {"HOME": str(root), "PATH": "/usr/bin:/bin", "LC_ALL": "C", "TZ": "UTC"}
          child = subprocess.Popen(["/bin/sleep", "30"], cwd=work, env=env)
          try:
              row = subprocess.check_output(["ps", "-p", str(child.pid), "-o", "pid=,ppid=,pgid=,lstart=,comm=,args="], env=env, text=True)
              assert len(row.splitlines()) == 1 and row.split()[0] == str(child.pid)
              out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "issue-866"
              out.mkdir()
              (out / "ps-linux.txt").write_text(row)
              (out / "metadata.json").write_text(json.dumps({"system": platform.platform(), "ps_version": subprocess.check_output(["ps", "--version"], env=env, text=True).strip(), "pid": child.pid, "ppid": os.getpid(), "cwd": str(work), "run_id": os.environ["GITHUB_RUN_ID"], "head": os.environ["GITHUB_SHA"]}, indent=2) + "\n")
          finally:
              child.terminate()
              child.wait()
      - uses: actions/upload-artifact@v4
        with:
          name: issue-866-linux-proc
          path: ${{ runner.temp }}/issue-866
          retention-days: 1
