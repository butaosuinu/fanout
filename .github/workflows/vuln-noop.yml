# Twin of vuln.yml for PRs that touch no Go-relevant path. A required check
# whose workflow is skipped by a paths filter stays "Expected" forever and
# blocks the merge (documented GitHub behavior), so this job reports the same
# `govulncheck` check name and passes immediately. Keep `paths-ignore` here
# identical to the `paths` list in vuln.yml, plus this file itself.
name: vuln-noop

on:
  pull_request:
    paths-ignore:
      ['go.mod', 'go.sum', '**.go', 'Makefile', '.github/workflows/vuln.yml']

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "no Go-relevant changes; the real govulncheck runs only for Go paths"
