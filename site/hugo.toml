baseURL = "https://butaosuinu.github.io/fanout/"
title = "fanout"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.en]
    locale = "en"
    label = "English"
    weight = 1
    [languages.en.params]
      tagline = "Fan GitHub issues or a local plan out into parallel panes — quietly."
  [languages.ja]
    locale = "ja"
    label = "日本語"
    weight = 2
    [languages.ja.params]
      tagline = "issue でも plan でも、並列に展開する。"

[params]
  github = "https://github.com/butaosuinu/fanout"

[page]
  nextPrevInSectionSortOrder = "asc"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.163.0"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
  [markup.goldmark.renderer]
    unsafe = true
  # 日本語ソースは一文一行で書くため、CJK 前後の soft break をスペースに
  # しない。css3draft は片側が ASCII (OPEN、fanout 等) の文境界も対象に
  # する。EN ページには影響しない。
  [markup.goldmark.extensions.cjk]
    enable = true
    eastAsianLineBreaks = true
    eastAsianLineBreaksStyle = "css3draft"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[minify]
  [minify.tdewolff.html]
    keepWhitespace = false
