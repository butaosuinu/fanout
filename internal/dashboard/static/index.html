<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- External requests policy: Google Fonts (fonts.googleapis.com /
     fonts.gstatic.com) are approved as the page's only external requests.
     The page URL carries the API token (?token=), so
     <meta name="referrer" content="no-referrer"> is KEPT: the tokened URL
     must never leak via the Referer header — to the font origins included.
     Everything else (favicon, CSS, JS) is local / inline. -->
<meta name="referrer" content="no-referrer" />
<meta name="color-scheme" content="light dark" />
<title>fanout dashboard</title>
<script>
/* FOUC avoidance — runs before first paint. localStorage key: fanout.theme */
(function () {
  try {
    var t = localStorage.getItem("fanout.theme");
    if (t !== "light" && t !== "dark")
      t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = "light"; }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=M+PLUS+1+Code:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M12 21 3.5 8M12 21 8.6 6.2M12 21l3.4-14.8M12 21 20.5 8' stroke='%23165E83' stroke-width='1.7' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='21' r='2.2' fill='%2300A3AF'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<script src="app.js" defer></script>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#" aria-label="fanout dashboard">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path class="rib" d="M12 21 3.5 8M12 21 8.6 6.2M12 21l3.4-14.8M12 21 20.5 8"
              stroke-width="1.7" stroke-linecap="round"/>
        <path class="arc" d="M4.6 6.4C9 3.4 15 3.4 19.4 6.4" stroke-width="1.4"
              stroke-linecap="round" stroke-dasharray="1 4"/>
        <circle class="pivot" cx="12" cy="21" r="2.2"/>
      </svg>
      fanout
    </a>
    <span class="brand-sub">dashboard</span>
    <div class="nav-meta">
      <span id="repo" title="">—</span>
      <span class="conn" id="link"><span class="pulse" aria-hidden="true"></span><span class="conn-label">connecting…</span></span>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="ライト / ダーク切替" aria-pressed="false">
        <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M20.4 14.2A8.6 8.6 0 0 1 9.8 3.6a8.6 8.6 0 1 0 10.6 10.6Z"/>
        </svg>
        <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <div class="main-col">
    <div class="wrap">

      <section class="hud rise" style="--d:.05s" aria-label="集計">
        <div class="stat"><label>panes</label><b id="s-total">0</b></div>
        <div class="stat"><label>live</label><b id="s-live">0</b></div>
        <div class="stat"><label>merged</label><b id="s-merged">0</b></div>
        <div class="stat"><label>pending</label><b id="s-pending">0</b></div>
        <div class="stat warned"><label>blocked</label><b id="s-blocked">0</b></div>
      </section>
      <div class="hud-bar rise" style="--d:.1s" aria-hidden="true"><i id="hud-fill" style="width:0%"></i></div>

      <div class="banner" id="banner" role="status" hidden></div>

      <div class="toolbar rise" style="--d:.2s">
        <input id="filter" type="search" autocomplete="off" spellcheck="false"
               placeholder="filter — 自由語 or state:open agent:claude wave:1 ci:fail dirty:yes" />
        <span id="filter-count"></span>
      </div>

      <main id="sessions" aria-live="polite"></main>

      <footer class="status-line">
        <span id="status">awaiting telemetry</span>
        <span class="grow"></span>
        <span>read-only · 127.0.0.1</span>
      </footer>

    </div>
  </div>

  <aside id="drawer" aria-label="ペイン詳細" hidden>
    <header class="drawer-head">
      <h3><span class="d-issue" id="d-issue"></span><span id="d-name"></span></h3>
      <button id="drawer-close" type="button" aria-label="詳細を閉じる">✕</button>
    </header>
    <div class="drawer-body">
      <section class="d-sec">
        <h4>pane</h4>
        <dl class="d-kv">
          <dt>agent</dt><dd id="d-agent"></dd>
          <dt>pane</dt><dd id="d-pane"></dd>
          <dt>tmux</dt><dd id="d-tmux"></dd>
          <dt>title</dt><dd id="d-title"></dd>
          <dt>created</dt><dd id="d-created"></dd>
          <dt>issue</dt><dd id="d-state"></dd>
        </dl>
      </section>
      <section class="d-sec">
        <h4>wave / blockers</h4>
        <dl class="d-kv">
          <dt>wave</dt><dd id="d-wave"></dd>
          <dt>blockers</dt><dd id="d-blockers"></dd>
        </dl>
      </section>
      <section class="d-sec">
        <h4>worktree</h4>
        <dl class="d-kv">
          <dt>path</dt><dd id="d-path"></dd>
          <dt>branch</dt><dd id="d-branch"></dd>
          <dt>diff</dt><dd id="d-diff"></dd>
          <dt>state</dt><dd id="d-dirty"></dd>
        </dl>
      </section>
      <section class="d-sec">
        <h4>pull requests</h4>
        <ul class="d-prs" id="d-prs"></ul>
      </section>
      <section class="d-sec">
        <h4>prompt</h4>
        <pre class="d-prompt" id="d-prompt"></pre>
      </section>
      <section class="d-sec">
        <h4>peek — 直近の出力</h4>
        <div class="terminal">
          <div class="term-bar"><i></i><i></i><i></i><span class="term-title" id="peek-title"></span></div>
          <pre id="peek-pre"></pre>
        </div>
        <div class="term-meta" id="peek-meta"></div>
      </section>
    </div>
  </aside>
</div>

</body>
</html>
